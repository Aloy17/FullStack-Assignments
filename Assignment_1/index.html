<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Portal</h1>

        <nav>
            <a href="#registration">Registration</a>
            <a href="#result">Result</a>
        </nav>
    </header>

    <section id="registration">
        <h2>Student Registration</h2>

        <form id="studentForm">

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="10 digit phone number" maxlength="10">

            <label for="course">Course</label>
            <select id="course">
                <option value="">Choose your course</option>
                <option>MCA</option>
                <option>MBA</option>
                <option>BBA</option>
                <option>B Tech CSE</option>
            </select>

            <label for="html">HTML Marks</label>
            <input type="number" id="html" placeholder="0 - 100">

            <label for="css">CSS Marks</label>
            <input type="number" id="css" placeholder="0 - 100">

            <label for="js">JavaScript Marks</label>
            <input type="number" id="js" placeholder="0 - 100">

            <button type="submit">Generate Result</button>
            <button type="button" id="resetBtn">Reset</button>

        </form>
    </section>

    <section id="result">
        <h2>Result</h2>

        <div id="output">
            <p>No result generated yet.</p>
        </div>
    </section>

    <script src="storage.js"></script>
    <script src="script.js"></script>

</body>
</html>
